# =========================================================
# APPLICATION
# =========================================================

spring.application.name=medical_01

# Application server port
server.port=8081


# =========================================================
# POSTGRESQL DATABASE
# =========================================================

# PostgreSQL connection URL
spring.datasource.url=jdbc:postgresql://localhost:5432/medical_01

# Database credentials
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}


# =========================================================
# JPA / HIBERNATE
# =========================================================

# Automatically updates the database schema based on JPA entities
spring.jpa.hibernate.ddl-auto=update

# Displays generated SQL statements in the console
spring.jpa.show-sql=true

# Formats generated SQL statements for better readability
spring.jpa.properties.hibernate.format_sql=true

# Disables database access during the web view rendering phase
spring.jpa.open-in-view=false


# =========================================================
# JWT
# =========================================================

# Secret key used to sign JWT tokens
jwt.secret=${JWT_SECRET}

# JWT expiration time in seconds (10 days)
jwt.expiration=864000

